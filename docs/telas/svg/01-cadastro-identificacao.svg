<rect id="aviso-lgpd-94" x="209.5" y="944.7" width="1021.0" height="193.2" rx="7.5" fill="rgb(248,250,252)" fill-opacity="1.000" stroke="rgb(227,231,238)" stroke-opacity="1.000" stroke-width="1"/>
<text id="texto-96" x="226.0" y="972.6" font-family="Inter, sans-serif" font-size="13.6" font-weight="600" fill="rgb(15,23,42)">Como usamos seus dados (LGPD — Lei 13.709/2018)</text>
<text id="texto-99" x="243.6" y="998.8" font-family="Inter, sans-serif" font-size="13.12" font-weight="400" fill="rgb(51,65,85)">Nome, CPF/CNPJ e e-mail servem só para identificar o titular no certificado e na prova de autoria, e ficam guardados no banco do Observatório.</text>
<text id="texto-101" x="243.6" y="1021.0" font-family="Inter, sans-serif" font-size="13.12" font-weight="400" fill="rgb(51,65,85)">Na lista pública da base aparecem apenas o nome do titular, o nome do projeto e o CPF/CNPJ mascarado (ex.: ***.982.247-**). A descrição do projeto não</text>
<text id="texto-102" x="243.6" y="1040.1" font-family="Inter, sans-serif" font-size="13.12" font-weight="400" fill="rgb(51,65,85)">é publicada.</text>
<text id="texto-104" x="243.6" y="1062.3" font-family="Inter, sans-serif" font-size="13.12" font-weight="400" fill="rgb(51,65,85)">Para a busca, só palavras-chave da descrição (sem seus dados pessoais) são enviadas ao EPO, à OpenAlex e ao GitHub.</text>
<text id="texto-106" x="243.6" y="1084.5" font-family="Inter, sans-serif" font-size="13.12" font-weight="400" fill="rgb(51,65,85)">Para corrigir ou apagar seus dados, fale com a equipe do Projeto Integrador (Art. 18 da LGPD).</text>
<text id="texto-110" x="251.6" y="1115.9" font-family="Inter, sans-serif" font-size="13.6" font-weight="600" fill="rgb(15,23,42)">Li e concordo com o uso dos meus dados para esta verificação e para a prova de autoria (Art. 7º, I da LGPD).</text>
