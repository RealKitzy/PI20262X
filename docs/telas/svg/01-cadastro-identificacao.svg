<text id="texto-4" x="184.0" y="128.4" font-family="Inter, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.56" fill="rgb(15,23,42)">Seu projeto de hardware já existe? Descubra antes de</text>
<text id="texto-5" x="184.0" y="164.8" font-family="Inter, sans-serif" font-size="28" font-weight="700" letter-spacing="-0.56" fill="rgb(15,23,42)">registrar.</text>
<text id="texto-7" x="184.0" y="199.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="rgb(51,65,85)">Descreva o que você criou. O sistema procura projetos parecidos em patentes, artigos científicos e</text>
<text id="texto-8" x="184.0" y="223.0" font-family="Inter, sans-serif" font-size="15" font-weight="400" fill="rgb(51,65,85)">repositórios abertos e mostra quais partes do seu projeto podem ser protegidas no Brasil.</text>
<text id="texto-12" x="184.0" y="261.1" font-family="Inter, sans-serif" font-size="13.6" font-weight="700" fill="rgb(21,128,61)">✓</text>
<text id="texto-13" x="202.4" y="261.1" font-family="Inter, sans-serif" font-size="13.6" font-weight="400" fill="rgb(100,116,139)">Busca real em patentes, OpenAlex e GitHub</text>
<text id="texto-16" x="505.4" y="261.1" font-family="Inter, sans-serif" font-size="13.6" font-weight="700" fill="rgb(21,128,61)">✓</text>
