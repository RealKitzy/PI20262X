<text id="texto-72" x="209.0" y="729.5" font-family="Inter, sans-serif" font-size="13.6" font-weight="600" fill="rgb(51,65,85)">Nome do projeto ou marca</text>
<rect id="campo-nome_projeto-73" x="209.5" y="743.5" width="502.0" height="44.4" rx="7.5" fill="rgb(255,255,255)" fill-opacity="1.000" stroke="rgb(207,214,224)" stroke-opacity="1.000" stroke-width="1"/>
<text id="texto-74" x="222.8" y="769.0" font-family="Inter, sans-serif" font-size="14.72" font-weight="400" fill="rgb(148,163,184)">Ex.: AgroNode — Sensor de Irrigação</text>
<text id="texto-76" x="209.0" y="807.0" font-family="Inter, sans-serif" font-size="12.48" font-weight="400" fill="rgb(100,116,139)">Mínimo de 5 caracteres.</text>
