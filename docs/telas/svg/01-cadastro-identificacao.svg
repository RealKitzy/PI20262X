<text id="texto-37" x="247.0" y="395.3" font-family="Inter, sans-serif" font-size="11.52" font-weight="600" letter-spacing="0.6912" fill="rgb(100,116,139)">ETAPA 1 DE 2 — IDENTIFICAÇÃO</text>
<text id="texto-39" x="247.0" y="417.6" font-family="Inter, sans-serif" font-size="16" font-weight="600" letter-spacing="-0.16" fill="rgb(15,23,42)">Preencha seus dados para começar.</text>
<text id="texto-41" x="247.0" y="441.6" font-family="Inter, sans-serif" font-size="14.08" font-weight="400" fill="rgb(51,65,85)">Depois você descreve o projeto e o sistema faz a busca.</text>
<rect id="card-44" x="184.5" y="485.5" width="1071.0" height="757.6" rx="11.5" fill="rgb(255,255,255)" fill-opacity="1.000" stroke="rgb(227,231,238)" stroke-opacity="1.000" stroke-width="1"/>
<text id="texto-48" x="209.0" y="529.3" font-family="Inter, sans-serif" font-size="20.8" font-weight="650" letter-spacing="-0.208" fill="rgb(15,23,42)">Conte o que você criou</text>
<text id="texto-50" x="209.0" y="555.8" font-family="Inter, sans-serif" font-size="14.4" font-weight="400" fill="rgb(100,116,139)">Você não precisa entender de leis: o sistema identifica sozinho placas, sensores, conectividade e</text>
<text id="texto-51" x="209.0" y="578.8" font-family="Inter, sans-serif" font-size="14.4" font-weight="400" fill="rgb(100,116,139)">software a partir da sua descrição.</text>
