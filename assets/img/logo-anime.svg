<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1b38"/>
      <stop offset="100%" stop-color="#140e1c"/>
    </linearGradient>
    <linearGradient id="orangeFlame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="50%" stop-color="#fb8500"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Fundo Arredondado Estilo Emblema Anime 2001 -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="url(#iconBg)" stroke="url(#orangeFlame)" stroke-width="5"/>
  <rect x="10" y="10" width="100" height="100" rx="20" fill="none" stroke="#fed7aa" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.55"/>

  <!-- Trilhas de Circuito Douradas/Laranjas ao Fundo -->
  <g stroke="#f97316" stroke-width="2" stroke-opacity="0.45" fill="none">
    <path d="M 16 36 H 32 L 42 46"/>
    <circle cx="16" cy="36" r="3" fill="#fb923c"/>
    <path d="M 104 36 H 88 L 78 46"/>
    <circle cx="104" cy="36" r="3" fill="#fb923c"/>
    <path d="M 16 84 H 32 L 42 74"/>
    <circle cx="16" cy="84" r="3" fill="#fb923c"/>
    <path d="M 104 84 H 88 L 78 74"/>
    <circle cx="104" cy="84" r="3" fill="#fb923c"/>
  </g>

  <!-- Asas/Antenas Mecha Anime Laranja -->
  <polygon points="14,50 32,26 36,62" fill="url(#orangeFlame)" stroke="#fff7ed" stroke-width="2"/>
  <polygon points="106,50 88,26 84,62" fill="url(#orangeFlame)" stroke="#fff7ed" stroke-width="2"/>

  <!-- Cabelo e Rosto Chibi Cyber-Anime -->
  <path d="M 28 44 Q 60 16 92 44 L 96 92 Q 82 84 78 102 L 42 102 Q 38 84 24 92 Z" fill="url(#orangeFlame)"/>
  <path d="M 36 52 Q 36 96 60 100 Q 84 96 84 52 Z" fill="#ffedd5" stroke="#9a3412" stroke-width="2"/>

  <!-- Franja Anime -->
  <path d="M 30 48 Q 45 24 60 26 Q 75 24 90 48 L 82 66 L 72 50 L 64 68 L 56 50 L 48 68 L 38 50 L 32 64 Z" fill="url(#orangeFlame)" stroke="#7c2d12" stroke-width="1.8"/>

  <!-- Olhos Estilo Anime -->
  <ellipse cx="48" cy="70" rx="6.5" ry="8.5" fill="#431407"/>
  <ellipse cx="48" cy="72" rx="5" ry="6" fill="#ea580c"/>
  <circle cx="46" cy="67" r="2.6" fill="#ffffff"/>

  <ellipse cx="72" cy="70" rx="6.5" ry="8.5" fill="#431407"/>
  <ellipse cx="72" cy="72" rx="5" ry="6" fill="#ea580c"/>
  <circle cx="70" cy="67" r="2.6" fill="#ffffff"/>

  <!-- Blush e Sorriso -->
  <ellipse cx="40" cy="81" rx="4" ry="2" fill="#fb7185" opacity="0.7"/>
  <ellipse cx="80" cy="81" rx="4" ry="2" fill="#fb7185" opacity="0.7"/>
  <path d="M 55 84 Q 60 90 65 84" fill="none" stroke="#9a3412" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Estrela Brilhante na Testa / Tiara Cyber -->
  <polygon points="60,32 63,40 71,40 65,45 67,53 60,48 53,53 55,45 49,40 57,40" fill="#fff7ed" stroke="#ea580c" stroke-width="1.2"/>
</svg>
