<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="shieldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldFlame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="blueCore" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base do Escudo Institucional / Brasão Tech Law -->
  <path d="M 60 8 L 104 26 C 104 68 84 98 60 114 C 36 98 16 68 16 26 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldFlame)" stroke-width="3" filter="url(#glow)"/>

  <!-- Borda interna fina de alta precisão -->
  <path d="M 60 16 L 96 32 C 96 68 79 92 60 105 C 41 92 24 68 24 32 Z" 
        fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Linhas de Circuito / Hardware Aberto integradas -->
  <g stroke="rgba(249, 115, 22, 0.5)" stroke-width="1.5" fill="none">
    <path d="M 32 45 H 48 L 54 52"/>
    <circle cx="32" cy="45" r="2.5" fill="#f97316"/>
    <path d="M 88 45 H 72 L 66 52"/>
    <circle cx="88" cy="45" r="2.5" fill="#f97316"/>
    <path d="M 40 82 H 50 L 56 75"/>
    <circle cx="40" cy="82" r="2.5" fill="#f97316"/>
    <path d="M 80 82 H 70 L 64 75"/>
    <circle cx="80" cy="82" r="2.5" fill="#f97316"/>
  </g>

  <!-- Balança da Justiça & Selo de Patente Institucional -->
  <rect x="58.5" y="32" width="3" height="48" rx="1.5" fill="#f8fafc"/>
  <path d="M 36 42 L 84 42" stroke="url(#goldFlame)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="60" cy="42" r="4.5" fill="#f8fafc" stroke="#f97316" stroke-width="1.5"/>

  <!-- Prato Esquerdo (Propriedade Industrial) -->
  <path d="M 38 43 L 30 58 M 38 43 L 46 58" stroke="rgba(248, 250, 252, 0.7)" stroke-width="1.2"/>
  <path d="M 28 58 Q 38 66 48 58 Z" fill="url(#blueCore)" stroke="#38bdf8" stroke-width="1.2"/>

  <!-- Prato Direito (Hardware Aberto / OSHW) -->
  <path d="M 82 43 L 74 58 M 82 43 L 90 58" stroke="rgba(248, 250, 252, 0.7)" stroke-width="1.2"/>
  <path d="M 72 58 Q 82 66 92 58 Z" fill="url(#goldFlame)" stroke="#fbbf24" stroke-width="1.2"/>

  <!-- Base da Balança / Microchip Core -->
  <rect x="48" y="78" width="24" height="6" rx="2" fill="url(#goldFlame)"/>
  <circle cx="60" cy="94" r="5" fill="#38bdf8" filter="url(#glow)"/>
</svg>
