<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 900 900">
  <defs>
    <!-- Padrão de Retícula de Mangá (Screentone Dots) -->
    <pattern id="halftone" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#f97316" fill-opacity="0.12"/>
      <circle cx="13" cy="13" r="1.1" fill="#fb923c" fill-opacity="0.09"/>
    </pattern>

    <!-- Grade Retro 2001 Y2K -->
    <pattern id="retrogrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#f97316" stroke-width="0.6" stroke-opacity="0.09"/>
    </pattern>

    <!-- Brilho Laranja Suave -->
    <radialGradient id="orangeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7a18" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0f0e17" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Fundo Base -->
  <rect width="900" height="900" fill="#110f18"/>
  <rect width="900" height="900" fill="url(#retrogrid)"/>
  <rect width="900" height="900" fill="url(#halftone)"/>

  <!-- Luzes de Ambiente -->
  <circle cx="180" cy="200" r="240" fill="url(#orangeGlow)"/>
  <circle cx="740" cy="680" r="280" fill="url(#orangeGlow)"/>

  <!-- BALÃO DE ANIME/MANGÁ 1: Clássico Arredondado Duplo (Topo Esquerdo) -->
  <g transform="translate(45, 55)" opacity="0.22">
    <path d="M 30 20 H 210 A 30 30 0 0 1 240 50 V 115 A 30 30 0 0 1 210 145 H 95 L 55 182 L 68 145 H 30 A 30 30 0 0 1 0 115 V 50 A 30 30 0 0 1 30 20 Z"
          fill="#1f1924" stroke="#f97316" stroke-width="3"/>
    <path d="M 36 28 H 204 A 22 22 0 0 1 226 50 V 109 A 22 22 0 0 1 204 131 H 36 A 22 22 0 0 1 14 109 V 50 A 22 22 0 0 1 36 28 Z"
          fill="none" stroke="#fb923c" stroke-width="1" stroke-dasharray="5,4"/>
    <text x="42" y="75" font-family="monospace" font-weight="bold" font-size="16" fill="#fb923c">PATENT CHECK!!</text>
    <text x="42" y="102" font-family="monospace" font-size="13" fill="#fdba74">[INPI // SYS.2001]</text>
  </g>

  <!-- BALÃO DE ANIME/MANGÁ 2: Explosão de Ação / Exclamação (Topo Direito) -->
  <g transform="translate(610, 40)" opacity="0.20">
    <polygon points="120,10 145,45 190,22 175,65 230,68 188,100 225,138 172,135 182,182 138,152 115,195 95,150 48,178 65,132 12,135 52,98 15,62 68,64 55,18 100,45"
             fill="#1f1924" stroke="#ff7a18" stroke-width="3"/>
    <text x="72" y="102" font-family="Impact, sans-serif" font-size="22" fill="#f97316" letter-spacing="1">OPEN HW!</text>
    <text x="78" y="124" font-family="monospace" font-size="12" fill="#fed7aa">CERN-OHL v2</text>
  </g>

  <!-- BALÃO DE ANIME/MANGÁ 3: Nuvem de Pensamento Otaku (Meio Esquerdo) -->
  <g transform="translate(60, 430)" opacity="0.18">
    <path d="M 65 95
             A 38 38 0 0 1 95 40
             A 48 48 0 0 1 180 35
             A 42 42 0 0 1 240 80
             A 36 36 0 0 1 225 142
             A 45 45 0 0 1 145 155
             A 40 40 0 0 1 75 140
             A 32 32 0 0 1 65 95 Z"
          fill="#1f1924" stroke="#fb923c" stroke-width="2.8"/>
    <circle cx="58" cy="168" r="11" fill="#1f1924" stroke="#fb923c" stroke-width="2.5"/>
    <circle cx="38" cy="190" r="6.5" fill="#1f1924" stroke="#fb923c" stroke-width="2"/>
    <text x="95" y="92" font-family="monospace" font-weight="bold" font-size="15" fill="#fdba74">GPLv3? MIT?</text>
    <text x="98" y="115" font-family="monospace" font-size="12" fill="#f97316">Analisando...</text>
  </g>

  <!-- BALÃO DE ANIME/MANGÁ 4: Caixa de Diálogo Visual Novel / RPG 2001 (Meio Direito) -->
  <g transform="translate(560, 360)" opacity="0.20">
    <rect x="0" y="0" width="280" height="125" rx="14" fill="#1f1924" stroke="#f97316" stroke-width="3"/>
    <rect x="8" y="8" width="264" height="24" rx="6" fill="#f97316" fill-opacity="0.25"/>
    <circle cx="22" cy="20" r="5" fill="#fb923c"/>
    <circle cx="38" cy="20" r="5" fill="#fdba74"/>
    <text x="54" y="25" font-family="monospace" font-size="12" font-weight="bold" fill="#ffedd5">DIALOG_BOX // VER.2001</text>
    <path d="M 210 125 L 235 160 L 245 125 Z" fill="#1f1924" stroke="#f97316" stroke-width="3"/>
    <text x="22" y="64" font-family="monospace" font-size="14" fill="#fed7aa">&gt; Proteção de Circuito</text>
    <text x="22" y="88" font-family="monospace" font-size="14" fill="#fb923c">&gt; Status: 100% OK! ★</text>
  </g>

  <!-- BALÃO DE ANIME/MANGÁ 5: Balão Oval Mangá Clássico Vertical (Base Esquerda) -->
  <g transform="translate(170, 680)" opacity="0.18">
    <ellipse cx="95" cy="85" rx="85" ry="65" fill="#1f1924" stroke="#f97316" stroke-width="2.8"/>
    <path d="M 145 135 L 185 170 L 162 122 Z" fill="#1f1924" stroke="#f97316" stroke-width="2.8"/>
    <text x="45" y="80" font-family="Impact, sans-serif" font-size="20" fill="#fb923c">TOP CHIP!!</text>
    <text x="42" y="104" font-family="monospace" font-size="12" fill="#fed7aa">LEI 11.484/07</text>
  </g>

  <!-- Linhas de Velocidade de Mangá (Speedlines Sutis nos Cantos) -->
  <g stroke="#f97316" stroke-opacity="0.12" stroke-width="1.5">
    <line x1="0" y1="0" x2="120" y2="90"/>
    <line x1="0" y1="30" x2="95" y2="100"/>
    <line x1="30" y1="0" x2="135" y2="75"/>
    <line x1="900" y1="900" x2="770" y2="800"/>
    <line x1="900" y1="860" x2="790" y2="780"/>
    <line x1="860" y1="900" x2="760" y2="820"/>
  </g>

  <!-- Estrelas / Brilhos Anime 2001 (Sparkles) -->
  <g fill="#fb923c" fill-opacity="0.25">
    <path d="M 450 110 Q 450 140 480 140 Q 450 140 450 170 Q 450 140 420 140 Q 450 140 450 110 Z"/>
    <path d="M 820 260 Q 820 280 840 280 Q 820 280 820 300 Q 820 280 800 280 Q 820 280 820 260 Z"/>
    <path d="M 420 620 Q 420 645 445 645 Q 420 645 420 670 Q 420 645 395 645 Q 420 645 420 620 Z"/>
  </g>
</svg>
